<script>
'use strict';
// IMPORTANTE: no escribir barra-asterisco en este archivo, ni en comentarios ni en textos
// (por ejemplo, el accept de imágenes con comodín). Apps Script lo toma como inicio de
// comentario y recorta el script. Usa // para comentar y las listas ACCEPT de abajo.
const ACCEPT = {
  imagen: 'image/png,image/jpeg,image/webp,image/gif',
  comprobante: 'image/png,image/jpeg,image/webp,image/heic,application/pdf',

// ---------------------------------------------------------------------------
// Estado y utilidades

const TZ = 'America/Mexico_City';
const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DAYS_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const S = {
  data: null,      // public.bootstrap
  token: null,
  user: null,
  weekStart: null, // lunes de la semana visible
  occ: {},         // ocupación por "horarioId|fecha"
  returnTo: null,
  adm: {},         // caché de listas del panel de administración
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return; } }, // sin almacenamiento
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const money = n => {
  const v = Number(n) || 0;
  const cents = Number.isInteger(v) ? 0 : 2;
  return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: cents, maximumFractionDigits: cents }).format(v);
};

function nowMx() {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .format(new Date()).replace(',', '');
}
const todayMx = () => nowMx().slice(0, 10);
function addDays(ymd, n) {
  const p = ymd.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
function weekday(ymd) { const p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
function mondayOf(ymd) { return addDays(ymd, -((weekday(ymd) + 6) % 7)); }
function fmtDate(ymd, withDay) {
  if (!ymd) return '—';
  const p = ymd.slice(0, 10).split('-').map(Number);
  return (withDay ? DAYS[weekday(ymd.slice(0, 10))] + ' ' : '') + p[2] + ' ' + MONTHS[p[1] - 1] + (withDay ? '' : ' ' + p[0]);
}
function fmtTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
}

// En GitHub Pages el generador define window.YC_API (la URL /exec) y se usa fetch;
// servido por Apps Script se usa google.script.run.
const API_URL = window.YC_API || '';
const offlineError = () => Object.assign(new Error('Sin conexión. Revisa tu internet e intenta de nuevo.'), { offline: true });

function send(action, payload) {
  if (API_URL) {
    if (navigator.onLine === false) return Promise.reject(offlineError());
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // sin verificación CORS previa
      body: JSON.stringify({ action, payload: payload || {}, token: S.token }),
    }).then(r => r.json()).catch(() => { throw offlineError(); });
  }
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(() => reject(offlineError()))
      .api(action, payload || {}, S.token);
  });
}

function call(action, payload) {
  return send(action, payload).then(r => {
    setOffline(false);
    if (r && r.ok) return r.data;
    const msg = (r && r.error) || 'Sin respuesta del servidor.';
    if (/sesión expiró/i.test(msg)) {
      setSession(null);
      closeModal();
      S.returnTo = currentRoute().join('/');
      setTimeout(() => go('entrar'), 0);
    }
    throw new Error(msg);
  }, e => { if (e.offline) setOffline(true); throw e; });
}

// Consultas de solo lectura: si no hay señal se usa la última respuesta guardada en el celular.
const saved = {
  get(k) { try { return JSON.parse(store.get(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { store.set(k, JSON.stringify({ t: Date.now(), v })); } catch (e) { return; } },
};
async function cachedCall(action, payload, key) {
  try {
    const data = await call(action, payload);
    saved.set(key, data);
    return data;
  } catch (e) {
    const hit = e.offline && saved.get(key);
    if (!hit) throw e;
    setOffline(true, hit.t);
    return hit.v;
  }
}

// Aviso discreto bajo el menú mientras no hay conexión.
function setOffline(on, since) {
  const bar = $('#offline');
  if (!bar) return;
  if (on) {
    const t = since ? new Date(since) : null;
    bar.textContent = 'Sin conexión' + (t ? ' · información guardada el ' + t.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) +
      ' a las ' + t.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : '') + ' · se actualiza sola al volver la señal';
  }
  bar.hidden = !on;
}

function toast(msg, isError) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 3800);
}

function openModal(title, html) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  $('#modal').hidden = false;
  const first = $('#modalBody input, #modalBody select, #modalBody textarea, #modalBody button');
  if (first) first.focus();
  return $('#modalBody');
}
function closeModal() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }

// Ejecuta una acción deshabilitando el botón y mostrando errores.
async function busy(btn, fn) {
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = 'Procesando…'; }
  try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; }
  }
}

function readFile(input, maxMb) {
  const f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  if (f.size > (maxMb || 5) * 1024 * 1024) return Promise.reject(new Error('El archivo pesa más de ' + (maxMb || 5) + ' MB.'));
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ name: f.name, mime: f.type, data: String(r.result).split(',')[1] });
    r.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(f);
  });
}

function formData(form) {
  const o = {};
  $$('[name]', form).forEach(el => {
    if (el.dataset.multi !== undefined) {
      // Varias casillas con el mismo nombre → lista separada por comas.
      if (!(el.name in o)) o[el.name] = '';
      if (el.checked) o[el.name] = o[el.name] ? o[el.name] + ',' + el.value : el.value;
      return;
    }
    if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; return; }
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return o;
}

// Correo y contraseña: el teclado del celular no debe poner mayúsculas ni corregir palabras.
const NO_AUTOFIX = 'autocapitalize="none" autocorrect="off" spellcheck="false"';

// Campo de contraseña con botón de ojo para mostrarla u ocultarla.
const EYE_OPEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function pwdInput(name, attrs) {
  return `<span class="pwd"><input type="password" name="${name}" ${attrs} ${NO_AUTOFIX}>` +
    `<button type="button" class="pwd-eye" data-eye aria-label="Mostrar contraseña" aria-pressed="false">${EYE_OPEN}</button></span>`;
}
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-eye]');
  if (!btn) return;
  e.preventDefault();
  const input = btn.parentNode.querySelector('input');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
  btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  btn.setAttribute('aria-pressed', String(show));
  input.focus();
});

function setSession(session) {
  // Al salir se borra lo guardado de esa cuenta en el celular.
  if (!session && S.user) store.set('yc_dash_' + S.user.id, null);
  S.token = session ? session.token : null;
  S.user = session ? session.user : null;
  store.set('yc_token', S.token);
  store.set('yc_user', S.user ? JSON.stringify(S.user) : null);

// Combinaciones listas: [nombre, títulos, textos].

  ['Clásico', 'EB Garamond', 'Work Sans'], ['Moderno', 'Outfit', 'Inter'], ['Minimal', 'Jost', 'Jost'], ['Suave', 'Comfortaa', 'Nunito']];
const FONT_SAMPLE = 'Respira y fluye';
const fontInfo = name => FONTS.find(f => f.name === name);
const fontStack = f => "'" + f.name + "', " + (f.group === 'elegante' || f.group === 'lectura' ? 'Georgia, serif' : "system-ui, -apple-system, 'Segoe UI', sans-serif");
const FONTS_CSS = 'https://fonts.googleapis.com/css2?';
const fontParam = (f, weights) => 'family=' + f.name.replace(/ /g, '+') + (weights ? ':wght@' + f.weights : '');
function fontLink(id, href) {
  let el = document.getElementById(id);
  if (!href) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('link'); el.id = id; el.rel = 'stylesheet'; document.head.appendChild(el); }
  if (el.getAttribute('href') !== href) el.href = href;
}
function applyFonts(c) {
  const t = fontInfo(c.fuenteTitulos) || fontInfo(BRAND_FONTS.fuenteTitulos);
  const x = (fontInfo(c.fuenteTexto) || {}).body ? fontInfo(c.fuenteTexto) : fontInfo(BRAND_FONTS.fuenteTexto);
  const root = document.documentElement.style;
  root.setProperty('--serif', fontStack(t));
  root.setProperty('--sans', fontStack(x));
  root.setProperty('--heading-weight', t.head);
  // Las de marca ya vienen en Index; las demás se piden a Google Fonts.
  const need = [t, x].filter((f, i, a) => a.indexOf(f) === i && f.name !== BRAND_FONTS.fuenteTitulos && f.name !== BRAND_FONTS.fuenteTexto);
  fontLink('siteFonts', need.length ? FONTS_CSS + need.map(f => fontParam(f, true)).join('&') + '&display=swap' : '');
}

// Música de fondo: el navegador no permite que suene sola; la persona toca ▶.

// hidden: la persona cerró el reproductor; vuelve a aparecer al recargar la página.
const P = { tracks: [], i: 0, hidden: false };

function updatePlayer(key) {
  const audio = $('#plAudio');
  const tracks = key ? (S.data.musica || []).filter(m => String(m.paginas).split(',').indexOf(key) >= 0) : [];
  P.tracks = tracks;
  const keep = tracks.findIndex(t => t.id === audio.dataset.track);
  if (keep >= 0) {
    P.i = keep; // la misma canción sigue sonando al cambiar a otra página que la tiene
  } else {
    const wasPlaying = !audio.paused;
    P.i = 0;
    if (!tracks.length) { audio.pause(); audio.removeAttribute('src'); delete audio.dataset.track; }
    else { audio.src = tracks[0].audio; audio.dataset.track = tracks[0].id; if (wasPlaying) audio.play().catch(() => {}); }
  }
  $('#player').hidden = !tracks.length || P.hidden;
  $('#plNext').hidden = tracks.length < 2;
  if (tracks.length) $('#plTitle').textContent = tracks[P.i].titulo || 'Música';
}

function playerSync() {
  const playing = !$('#plAudio').paused;
  $('#plPlay').textContent = playing ? '❚❚' : '▶';
  $('#plPlay').setAttribute('aria-label', playing ? 'Pausar música' : 'Reproducir música');
  $('#player').classList.toggle('playing', playing);
}

function initPlayer() {
  const audio = $('#plAudio');
  const next = () => {
    if (!P.tracks.length) return;
    P.i = (P.i + 1) % P.tracks.length;
    audio.src = P.tracks[P.i].audio;
    audio.dataset.track = P.tracks[P.i].id;
    $('#plTitle').textContent = P.tracks[P.i].titulo || 'Música';
    audio.play().catch(() => {});
  };
  $('#plPlay').addEventListener('click', () => {
    if (audio.paused) audio.play().catch(() => toast('No se pudo reproducir el audio.', true)); else audio.pause();
  });
  $('#plNext').addEventListener('click', next);
  $('#plClose').addEventListener('click', () => { audio.pause(); P.hidden = true; $('#player').hidden = true; });
  audio.addEventListener('ended', () => { if (P.tracks.length > 1) next(); else audio.play().catch(() => {}); });
  ['play', 'pause'].forEach(ev => audio.addEventListener(ev, playerSync));
}

const ROUTES = {
  '': pageHome,
  horarios: pageSchedule,
  paquetes: pagePackages,
  instructores: pageInstructors,
  terminos: pageTerms,
  entrar: () => pageAuth('login'),

// Hay colores o letras sin guardar en Administrar → Sitio: no se repinta por detrás.
const editingSite = () => !!(S.leaveGuard && $('#saveBar') && !$('#saveBar').hidden);
function go(path) { location.hash = '#/' + path; }
function currentRoute() { return location.hash.replace(/^#\/?/, '').split('/'); }

async function render() {
  if (S.leaveGuard) {
    if (!S.leaveGuard()) { history.replaceState(null, '', S.guardHash); return; }
    S.leaveGuard = null;
  }
  S.guardHash = location.hash;
  const [name, sub] = currentRoute();
  const page = ROUTES[name] || pageHome;
  $('#nav').classList.remove('open');
  $('#menuBtn').setAttribute('aria-expanded', 'false');
  $$('#nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/' + name));
  const app = $('#app');
  const key = ROUTES[name] ? routeKey(name) : 'inicio';
  document.body.classList.toggle('at-home', key === 'inicio');
  // En Shala Virtual el menú del sitio sobra: el panel trae su propio encabezado y menú.
  document.body.classList.toggle('in-panel', name === 'panel' || name === 'admin');
  renderDesign(key);
  updatePlayer(key);
  if (!onInvitePage()) hideInstall();
  else if (S.data) maybeInviteInstall();
  try {

// Clases del horario semanal para una fecha concreta.
function slotsOn(ymd) {
  const d = weekday(ymd);
  return S.data.horario.filter(s => s.dia === d).sort((a, b) => a.hora < b.hora ? -1 : 1);
}


async function loadOccupancy(desde, hasta) {
  // Si falla, el horario se muestra sin cupos.
  try { Object.assign(S.occ, await call('public.occupancy', { desde, hasta })); } catch (e) { return; }
}

// Hora como en el calendario: 07:15pm.
function fmtClock(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return String((h % 12) || 12).padStart(2, '0') + ':' + String(m).padStart(2, '0') + (h < 12 ? 'am' : 'pm');
}

// Calendario por día o semana: lo usan Horarios y el Calendario de Shala Virtual.
const newCal = () => ({ mode: matchMedia('(max-width: 720px)').matches ? 'dia' : 'semana', day: todayMx(), filter: '', open: false });
const calEmpty = () => `<div class="cal-empty"><img src="${LOGO_FLOWER}" alt="">No hay clases que mostrar</div>`;

function calClass(s, fecha, mine) {
  const ins = instructor(s.instructorId);
  const past = fecha + ' ' + s.hora <= nowMx();
  const reserva = mine && mine[s.id + '|' + fecha];
  const inner = `${micon(s.modalidad === 'en línea' ? MI.screen : MI.home)}
    <span class="cc-txt"><b>${esc(clase(s.claseId).nombre || 'Clase')}</b>
      <span>${esc(ins.nombre || '')}</span>${s.sala ? `<span>${esc(s.sala)}</span>` : ''}<span>${s.duracion} min</span>
      ${reserva ? '<small class="tag tag-ok">Reservada</small>' : ''}</span>`;
  return past ? `<div class="cc past">${inner}</div>` : `<button type="button" class="cc" data-slot="${esc(s.id)}" data-date="${fecha}">${inner}</button>`;
}

function calDayHtml(day, slotsFor, mine) {
  const slots = slotsFor(day);
  if (!slots.length) return calEmpty();
  return `<div class="cd"><div class="cd-head">${DAYS[weekday(day)]} ${Number(day.slice(8))}</div>
    ${slots.map(s => `<div class="cd-row"><div class="cd-time">${fmtClock(s.hora)}</div>${calClass(s, day, mine)}</div>`).join('')}</div>`;
}

function calWeekHtml(days, slotsFor, mine) {
  const today = todayMx();
  const hours = Array.from(new Set(days.reduce((all, d) => all.concat(slotsFor(d).map(s => s.hora)), []))).sort();
  if (!hours.length) return calEmpty();
  return `<div class="cw-wrap"><table class="cw"><thead><tr><th>Hora</th>
    ${days.map(d => `<th class="${d === today ? 'today' : ''}">${DAYS_SHORT[weekday(d)]} ${Number(d.slice(8))}</th>`).join('')}</tr></thead>
    <tbody>${hours.map(h => `<tr><td class="cw-hour">${fmtClock(h)}</td>
      ${days.map(d => `<td class="${d === today ? 'today' : ''}">${slotsFor(d).filter(s => s.hora === h).map(s => calClass(s, d, mine)).join('')}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function calPeriodLabel(cal, start, end) {
  if (cal.mode === 'semana') return periodLabel(start, end);
  const p = start.split('-').map(Number);
  return (start === todayMx() ? 'Hoy, ' : '') + DAYS[weekday(start)].toLowerCase() + ' ' + p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
}

function myClassModal(reserva, horarioId, fecha) {
  const s = byId(S.data.horario, horarioId);
  const body = openModal('Tu reserva', `
    <p><b>${esc(clase(s.claseId).nombre)}</b> con ${esc(instructor(s.instructorId).nombre)}<br>
    <span class="muted">${fmtDate(fecha, true)} · ${fmtTime(s.hora)} · ${s.duracion} min</span></p>
    <div class="row"><button class="btn btn-ghost" data-cancel="${esc(reserva.id)}">Cancelar reserva</button>
    <button class="btn btn-primary" data-close>Listo</button></div>`);
  bindCancel(body);
}

function tapClass(horarioId, fecha, mine, after) {
  const key = horarioId + '|' + fecha;
  if (mine && mine[key]) return myClassModal(mine[key], horarioId, fecha);
  const s = byId(S.data.horario, horarioId);
  if (s.cupo > 0 && (S.occ[key] || 0) >= s.cupo) return toast('Esta clase está llena.');
  bookFlow(horarioId, fecha, after);
}

// opts: head (HTML encima de los controles), withFilter, mine (reservas del alumno), after (tras reservar).
async function mountCalendar(box, cal, opts) {
  const today = todayMx();
  const draw = () => {
    const start = cal.mode === 'semana' ? mondayOf(cal.day) : cal.day;
    const end = cal.mode === 'semana' ? addDays(start, 6) : start;
    const days = cal.mode === 'semana' ? [0, 1, 2, 3, 4, 5, 6].map(i => addDays(start, i)) : [start];
    const used = Array.from(new Set(S.data.horario.map(s => s.claseId)));
    const slotsFor = d => slotsOn(d).filter(s => !cal.filter || s.claseId === cal.filter);
    box.innerHTML = `${opts.head || ''}
      <div class="cal-controls">
        <div><span class="cal-label">Ver por</span><div class="seg">
          <button type="button" data-mode="dia" class="${cal.mode === 'dia' ? 'on' : ''}">${micon(MI.day)}Día</button>
          <button type="button" data-mode="semana" class="${cal.mode === 'semana' ? 'on' : ''}">${micon(MI.cal)}Semana</button></div></div>
        <div><span class="cal-label">Periodo</span><div class="period">
          <button type="button" id="calPrev" aria-label="Anterior" ${start <= today ? 'disabled' : ''}>${micon(MI.prev)}</button>
          <span class="period-date">${calPeriodLabel(cal, start, end)}<input type="date" id="calDate" aria-label="Elegir fecha" min="${today}" value="${cal.day}"></span>
          <button type="button" id="calNext" aria-label="Siguiente">${micon(MI.next)}</button></div>
          ${opts.withFilter ? `<div class="cal-filter-row"><button type="button" class="btn-filter ${cal.filter ? 'on' : ''}" id="calFilter">${micon(MI.filter)}Filtrar${cal.filter ? ' · ' + esc(clase(cal.filter).nombre) : ''}</button></div>` : ''}</div>
      </div>
      ${cal.open ? `<div class="chips"><button class="chip ${!cal.filter ? 'on' : ''}" data-f="">Todas</button>
        ${used.map(id => `<button class="chip ${cal.filter === id ? 'on' : ''}" data-f="${esc(id)}">${esc(clase(id).nombre)}</button>`).join('')}</div>` : ''}
      <div class="cal-list">${cal.mode === 'semana' ? calWeekHtml(days, slotsFor, opts.mine) : calDayHtml(start, slotsFor, opts.mine)}</div>
      <div class="cal-foot"><div><div>${micon(MI.home)} = Clase presencial</div><div>${micon(MI.screen)} = Clase en línea</div></div>
        <div class="cal-tz">Horario según la hora de Torreón<br><span>America/Monterrey</span></div></div>`;
    $$('[data-mode]', box).forEach(b => b.addEventListener('click', () => { cal.mode = b.dataset.mode; if (cal.mode === 'dia' && cal.day < today) cal.day = today; refresh(); }));
    $('#calPrev', box).addEventListener('click', () => { cal.day = addDays(cal.mode === 'semana' ? mondayOf(cal.day) : cal.day, cal.mode === 'semana' ? -7 : -1); if (cal.day < today && cal.mode === 'dia') cal.day = today; refresh(); });
    $('#calNext', box).addEventListener('click', () => { cal.day = addDays(cal.mode === 'semana' ? mondayOf(cal.day) : cal.day, cal.mode === 'semana' ? 7 : 1); refresh(); });
    const pick = $('#calDate', box);
    pick.addEventListener('click', () => { try { pick.showPicker(); } catch (e) { return; } });
    pick.addEventListener('change', () => { if (pick.value) { cal.day = pick.value; refresh(); } });
    if (opts.withFilter) $('#calFilter', box).addEventListener('click', () => { cal.open = !cal.open; draw(); });
    $$('[data-f]', box).forEach(b => b.addEventListener('click', () => { cal.filter = b.dataset.f; cal.open = false; draw(); }));
    $$('[data-slot]', box).forEach(b => b.addEventListener('click', () => tapClass(b.dataset.slot, b.dataset.date, opts.mine, opts.after || draw)));
    return [start, end];
  };
  const refresh = async () => {
    const [start, end] = draw();
    await loadOccupancy(start, end);
    if (box.isConnected) draw();
  };
  await refresh();
}

function bookFlow(horarioId, fecha, after) {
  if (!S.user) {
    S.returnTo = 'horarios';
    toast('Inicia sesión o crea tu cuenta para reservar.');
    return go('entrar');
  }
  const s = byId(S.data.horario, horarioId);
  const c = clase(s.claseId);
  const body = openModal('Confirmar reserva', `
    <p><b>${esc(c.nombre)}</b> con ${esc(instructor(s.instructorId).nombre)}<br>
    <span class="muted">${fmtDate(fecha, true)} · ${fmtTime(s.hora)} · ${s.duracion} min</span></p>
    <p class="small muted">Puedes cancelar hasta ${esc(cfg().horasCancelacion || 2)} h antes y recuperas la clase.</p>
    <div class="row"><button class="btn btn-primary" id="okBook">Reservar mi lugar</button>
    <button class="btn btn-ghost" data-close>Cancelar</button></div>`);
  $('#okBook', body).addEventListener('click', e => busy(e.target, async () => {
    try {
      await call('me.book', { horarioId, fecha });
    } catch (err) {
      if (/paquete vigente/.test(err.message)) {
        openModal('Necesitas un paquete', `<p>${esc(err.message)}</p>
          <div class="row"><a class="btn btn-primary" href="#/paquetes" data-close>Ver paquetes</a></div>`);
        return;
      }
      throw err;
    }
    closeModal();
    toast('¡Listo! Tu lugar está reservado.');
    S.occ[horarioId + '|' + fecha] = (S.occ[horarioId + '|' + fecha] || 0) + 1;
    if (after) after();
  }).catch(() => {}));
}

function bindClasses(root) {
  const track = $('#clTrack', root);
  if (!track) return;
  const prev = $('#clPrev', root), next = $('#clNext', root);
  const sync = () => { prev.disabled = track.scrollLeft <= 1; next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1; };
  const move = dir => {
    const c = track.children;
    track.scrollBy({ left: dir * (c.length > 1 ? c[1].offsetLeft - c[0].offsetLeft : track.clientWidth), behavior: 'smooth' });
  };
  prev.addEventListener('click', () => move(-1));
  next.addEventListener('click', () => move(1));
  track.addEventListener('scroll', sync, { passive: true });
  sync();
}

function bindCopy(root) {
  $$('[data-copy]', root).forEach(b => b.addEventListener('click', async () => {
    const text = b.dataset.copy;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      // El marco de Apps Script puede bloquear el portapapeles: se usa el método clásico.
      const t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      t.remove();
    }
    toast(ok ? 'Copiado: ' + text : 'Mantén presionado el número para copiarlo.', !ok);
  }));
}

function bindPeople(root) {

    <p class="center small" style="margin-top:16px">${reg ? '¿Ya tienes cuenta? <a href="#/entrar">Inicia sesión</a>' : '¿Primera vez? <a href="#/registro">Crea tu cuenta</a>'}</p>
    ${!reg ? `<p class="center small muted">¿Olvidaste tu contraseña? ${waLink() ? `<a href="${esc(waLink('Hola, olvidé mi contraseña'))}" target="_blank" rel="noopener">Escríbenos</a>` : 'Contacta al estudio'} y la restablecemos.</p>` : ''}
  </div></div>`;
  $('#authForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target);
    busy(btn, async () => {

function bindCancel(root) {

function periodLabel(start, end) {
  const a = start.split('-').map(Number), b = end.split('-').map(Number);
  if (start === end) return DAYS[weekday(start)] + ' ' + a[2] + ' ' + MONTHS[a[1] - 1] + ' ' + a[0];
  return a[2] + (a[1] !== b[1] ? ' ' + MONTHS[a[1] - 1] : '') + (a[0] !== b[0] ? ' ' + a[0] : '') + ' al ' + b[2] + ' ' + MONTHS[b[1] - 1] + ' ' + b[0];
}

function memberBookings(main, d) {
  const now = nowMx();
  const rows = d.reservas.map(r => Object.assign({}, r, { slot: byId(S.data.horario, r.horarioId) }));
  const canCancel = r => r.estado === 'reservada' && r.slot.hora && (r.fecha + ' ' + r.slot.hora) > now;
  const next = rows.filter(r => r.estado === 'reservada' && r.fecha >= todayMx()).sort((a, b) => (a.fecha + a.slot.hora) < (b.fecha + b.slot.hora) ? -1 : 1);
  main.innerHTML = `<h1 class="member-title">Mis reservaciones</h1>
    <h3>Próximas</h3>
    ${next.length ? next.map(r => `<div class="slot"><div class="time">${fmtTime(r.slot.hora)}</div>

async function pageInstructor(app, fecha) {
  if (!S.user) { S.returnTo = 'instructor'; return go('entrar'); }
  if (S.user.rol !== 'instructor' && S.user.rol !== 'admin') return go('panel');
  fecha = /^\d{4}-\d{2}-\d{2}$/.test(fecha || '') ? fecha : todayMx();
  app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const list = await cachedCall('instructor.classes', { fecha }, 'yc_ins_' + S.user.id + '_' + fecha);
  const all = list.reduce((a, x) => a.concat(x.reservas), []);
  const count = st => all.filter(r => r.estado === st).length;

  $('#insDate', app).addEventListener('change', e => e.target.value && reload(e.target.value));
  const mark = (ids, estado) => Promise.all(ids.map(reservaId => call('instructor.markAttendance', { reservaId, estado })));
  $$('[data-mark]', app).forEach(b => b.addEventListener('click', () => {

    const current = (all.find(r => r.id === b.dataset.id) || {}).estado;

function fontPicker(k, label, value, forBody) {
  const list = FONTS.filter(f => !forBody || f.body);
  return `<div class="font-col"><span class="font-col-h">${label}</span><div class="font-pick" data-pick="${k}">${FONT_GROUPS.map(g => {
    const fs = list.filter(f => f.group === g[0]);
    return fs.length ? `<div class="font-group"><b>${g[1]}</b><small class="muted">${g[2]}</small></div>` + fs.map(f => `<label class="font-opt">
      <input type="radio" name="${k}" value="${esc(f.name)}" ${f.name === value ? 'checked' : ''}>
      <span style="font-family:${esc(fontStack(f))}">${esc(f.name)}</span></label>`).join('') : '';
  }).join('')}</div></div>`;
}

async function admList(tabla, force) {
  if (force || !S.adm[tabla]) S.adm[tabla] = await call('admin.list', { tabla });
  return S.adm[tabla];
}

function cellValue(tabla, k, row) {
  const v = row[k];
  if (typeof v === 'boolean') return v ? '<span class="tag tag-ok">Sí</span>' : '<span class="tag tag-bad">No</span>';
  if (k === 'dia') return DAYS[v];
  if (k === 'hora') return fmtTime(v);
  if (k === 'precio') return money(v);
  if (k === 'clases') return v === 0 ? 'Ilimitadas' : v;
  if (k === 'imagen') return v ? `<img src="${esc(v)}" alt="" style="width:72px;height:48px;object-fit:cover;border-radius:6px">` : '—';
  if (k === 'pagina') return esc(pageLabel(v));
  if (k === 'uso') return esc((DESIGN_USES.find(u => u[0] === (v || 'fondo')) || ['', v])[1]);
  if (k === 'paginas') return esc(String(v || '').split(',').filter(Boolean).map(pageLabel).join(', ') || '—');
  if (k === 'claseId') return esc(byId(S.adm.Clases, v).nombre || '—');
  if (k === 'instructorId') return esc(byId(S.adm.Instructores, v).nombre || '—');
  return esc(v);
}

function fieldHtml(f, value) {
  const v = value === undefined ? (f.def !== undefined ? f.def : '') : value;
  const hint = f.hint ? `<small class="muted">${esc(f.hint)}</small>` : '';
  const full = f.t === 'textarea' || f.t === 'image' ? ' class="full"' : '';
  if (f.t === 'textarea') return `<label${full}><span>${f.l}</span><textarea name="${f.k}">${esc(v)}</textarea>${hint}</label>`;
  if (f.t === 'bool') return `<label class="check"><input type="checkbox" name="${f.k}" ${v === true || v === 'true' ? 'checked' : ''}>${f.l}</label>`;
  if (f.t === 'select' || f.t === 'ref') {
    const opts = f.t === 'ref' ? (S.adm[f.ref] || []).map(x => [x.id, x.nombre]) : f.opts;
    return `<label><span>${f.l}</span><select name="${f.k}">${opts.map(o => `<option value="${esc(o[0])}" ${String(v) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>${hint}</label>`;
  }
  if (f.t === 'image') return `<div class="full" style="margin-bottom:14px"><label style="margin-bottom:6px"><span>${f.l}</span><input name="${f.k}" value="${esc(v)}" placeholder="URL de la imagen"></label>
    <div class="row">${v ? `<img src="${esc(v)}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px">` : ''}
    <input type="file" accept="${ACCEPT.imagen}" data-upload="${f.k}" data-kind="imagen" style="max-width:280px"><small class="muted">Se guarda en tu Drive · máx. 5 MB</small></div>${hint}</div>`;
  if (f.t === 'audio') return `<div class="full" style="margin-bottom:14px"><label style="margin-bottom:6px"><span>${f.l}</span><input name="${f.k}" value="${esc(v)}" placeholder="URL del audio"></label>
    <div class="row">${v ? `<audio controls preload="none" src="${esc(v)}" style="max-width:260px"></audio>` : ''}
    <input type="file" accept="${ACCEPT.audio}" data-upload="${f.k}" data-kind="audio" style="max-width:280px"><small class="muted">MP3, M4A u OGG · máx. 15 MB</small></div>${hint}</div>`;
  if (f.t === 'pages') {
    const on = String(v).split(',');
    return `<div class="full" style="margin-bottom:14px"><span style="display:block;font-weight:500;font-size:.9rem;margin-bottom:6px">${f.l}</span>
      <div class="page-checks">${PAGE_LABELS.map(p => `<label class="check"><input type="checkbox" name="${f.k}" value="${p[0]}" data-multi ${on.indexOf(p[0]) >= 0 ? 'checked' : ''}>${p[1]}</label>`).join('')}</div>${hint}</div>`;
  }
  if (f.t === 'color') return `<label><span>${f.l}</span><input type="color" name="${f.k}" value="${esc(/^#[0-9a-f]{6}$/i.test(v) ? v : f.def || '#000000')}">${hint}</label>`;
  const type = f.t === 'number' ? 'number' : f.t === 'time' ? 'time' : 'text';
  return `<label><span>${f.l}</span><input type="${type}" name="${f.k}" value="${esc(v)}" ${type === 'number' ? 'step="any"' : ''}>${hint}</label>`;
}

function bindUploads(root) {
  $$('[data-upload]', root).forEach(inp => inp.addEventListener('change', async () => {
    const audio = inp.dataset.kind === 'audio';
    try {
      toast(audio ? 'Subiendo audio… puede tardar un poco.' : 'Subiendo imagen…');
      const archivo = await readFile(inp, audio ? 15 : 5);
      const r = await call('admin.upload', { archivo, tipo: inp.dataset.kind });
      $(`[name="${inp.dataset.upload}"]`, root).value = r.url;
      toast(audio ? 'Audio subido. Guarda para publicarlo.' : 'Imagen subida. Guarda para publicarla.');
    } catch (e) { toast(e.message, true); }
  }));
}

async function adminCrud(box, tabla) {
  const schema = SCHEMAS[tabla];
  await Promise.all([admList('Clases'), admList('Instructores')]);
  const rows = (await admList(tabla, true)).slice().sort(schema.sort || (() => 0));
  const label = k => (schema.fields.find(f => f.k === k) || { l: k }).l;
  box.innerHTML = `<div class="row" style="margin-bottom:14px"><h2 style="margin:0">${schema.title}</h2><span class="spacer"></span>
    <button class="btn btn-primary btn-sm" id="addRow">+ Agregar</button></div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr>${schema.cols.map(k => `<th>${esc(label(k))}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>${schema.cols.map(k => `<td>${cellValue(tabla, k, r)}</td>`).join('')}
      <td class="row" style="flex-wrap:nowrap"><button class="btn btn-ghost btn-sm" data-edit="${esc(r.id)}">Editar</button>
      <button class="btn btn-danger btn-sm" data-del="${esc(r.id)}">Borrar</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty card">Sin registros todavía.</div>'}`;
  const edit = row => {
    const body = openModal((row ? 'Editar' : 'Agregar') + ' · ' + schema.title, `<form id="crud"><div class="form-grid">${schema.fields.map(f => fieldHtml(f, row ? row[f.k] : undefined)).join('')}</div>
      <button class="btn btn-primary" type="submit">Guardar</button></form>`);
    bindUploads(body);
    $('#crud', body).addEventListener('submit', e => {
      e.preventDefault();
      const item = formData(e.target);
      if (row) item.id = row.id;
      busy($('button[type=submit]', e.target), async () => {
        await call('admin.save', { tabla, item });
        closeModal(); toast('Guardado.'); await refreshPublic(); adminCrud(box, tabla);
      }).catch(() => {});
    });
  };
  $('#addRow', box).addEventListener('click', () => edit(null));
  $$('[data-edit]', box).forEach(b => b.addEventListener('click', () => edit(rows.find(r => r.id === b.dataset.edit))));
  $$('[data-del]', box).forEach(b => b.addEventListener('click', () => {
    if (!confirm('¿Borrar este registro? No se puede deshacer.')) return;
    busy(b, async () => { await call('admin.delete', { tabla, id: b.dataset.del }); toast('Borrado.'); await refreshPublic(); adminCrud(box, tabla); }).catch(() => {});
  }));
}

      : '<div class="empty card">No hay compras en esta vista.</div>'}`;

  $('#sellBtn', box).addEventListener('click', () => sellModal(null, reload));

}

  $$('[data-pair]', form).forEach(b => b.addEventListener('click', () => { const p = FONT_PAIRS[b.dataset.pair]; setFonts(p[1], p[2]); }));
  syncFonts(true);

    }).catch(() => {});

}

const ADMIN_MENU = [['inicio', 'Inicio', MI.home], ['sitio', 'Estudio', MI.gear], ['instructores', 'Instructores', MI.user],
  ['clases', 'Clases', MI.leaf], ['horario', 'Horarios', MI.cal], ['paquetes', 'Paquetes', MI.bag],
  ['pagos', 'Pagos', MI.money], ['alumnos', 'Estudiantes', MI.users], ['galeria', 'Imágenes', MI.image], ['musica', 'Música', MI.music]];

const MONTHS_LONG = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
// "Hoy, domingo 8 nov 2026" (corto) o "Hoy, domingo 8 de noviembre de 2026" (largo).
function dayTitle(ymd, long) {
  const p = ymd.split('-').map(Number);
  const rel = { [todayMx()]: 'Hoy', [addDays(todayMx(), 1)]: 'Mañana', [addDays(todayMx(), -1)]: 'Ayer' }[ymd];
  const day = DAYS[weekday(ymd)];
  const date = long ? p[2] + ' de ' + MONTHS_LONG[p[1] - 1] + ' de ' + p[0] : p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
  return (rel ? rel + ', ' + day.toLowerCase() : day) + ' ' + date;
}
function dayBadge(ymd) {
  return { [todayMx()]: 'Hoy', [addDays(todayMx(), 1)]: 'Mañana', [addDays(todayMx(), -1)]: 'Ayer' }[ymd] || DAYS_SHORT[weekday(ymd)] + ' ' + Number(ymd.slice(8));
}

// Inicio del administrador: calendario de clases con "Tomar asistencia" en cada una.
async function adminCalendar(box) {
  const cal = S.acal = S.acal || { mode: 'dia', day: todayMx(), only: 'todas', filter: '', open: false };
  const today = todayMx();
  const notices = await call('admin.overview').catch(() => null);
  const draw = () => {
    const start = cal.mode === 'semana' ? mondayOf(cal.day) : cal.day;
    const end = cal.mode === 'semana' ? addDays(start, 6) : start;
    const days = cal.mode === 'semana' ? [0, 1, 2, 3, 4, 5, 6].map(i => addDays(start, i)) : [start];
    const used = Array.from(new Set(S.data.horario.map(s => s.claseId)));
    $('#admTitle').textContent = cal.mode === 'dia' ? dayTitle(start) : periodLabel(start, end);
    const cards = [];
    days.forEach(fecha => slotsOn(fecha).forEach(s => {
      if (cal.filter && s.claseId !== cal.filter) return;
      const past = fecha + ' ' + s.hora <= nowMx();
      if (cal.only === 'proximas' && past) return;
      const ins = instructor(s.instructorId);
      const taken = S.occ[s.id + '|' + fecha] || 0;
      const online = s.modalidad === 'en línea';
      cards.push(`<article class="acard ${past ? 'past' : ''}">
        <div class="acard-head"><span class="acard-ico">${micon(online ? MI.screen : MI.home)}</span>
          <div><small>${s.sala ? esc(s.sala) + ' · ' : ''}${online ? 'En línea' : 'Presencial'}</small><div class="acard-date">${dayTitle(fecha, true)}</div></div>
          <span class="acard-badge">${micon(MI.cal)}${esc(dayBadge(fecha))}</span></div>
        <h3>${esc(clase(s.claseId).nombre || 'Clase')}</h3>
        <ul class="acard-info"><li>${micon(MI.user)}Imparte: ${esc(ins.nombre || '—')}</li>
          <li>${micon(MI.sun)}Hora de inicio: ${fmtTime(s.hora)}</li>
          <li>${micon(MI.clock)}Duración de la clase: ${s.duracion} min</li></ul>
        <div class="acard-foot"><button type="button" class="btn-dark" data-att="${esc(s.id)}" data-date="${fecha}">${micon(MI.list)}Tomar asistencia</button>
          <span>Espacios ocupados: ${taken}${s.cupo ? ' / ' + s.cupo : ''}</span></div></article>`);
    }));
    box.innerHTML = `${notices ? `<div class="admin-notes">
        <a class="admin-note" href="#/admin/pagos"><span>${micon(MI.money)}</span>${notices.pendientes ? `Tienes ${notices.pendientes} pago${notices.pendientes === 1 ? '' : 's'} por aprobar.` : 'No hay pagos por aprobar.'}</a>
        <a class="admin-note" href="#/admin/alumnos"><span>${micon(MI.users)}</span>${notices.proximosVencimientos.length ? `${notices.proximosVencimientos.length} estudiante${notices.proximosVencimientos.length === 1 ? '' : 's'} con paquete por vencer esta semana.` : `${notices.alumnosActivos} estudiantes con paquete vigente.`}</a>
      </div>` : ''}
      <div class="admin-controls">
        <div><span class="cal-label">Ver por</span><div class="seg">
          <button type="button" data-mode="dia" class="${cal.mode === 'dia' ? 'on' : ''}">${micon(MI.day)}Día</button>
          <button type="button" data-mode="semana" class="${cal.mode === 'semana' ? 'on' : ''}">${micon(MI.cal)}Semana</button></div></div>
        <div><span class="cal-label">Mostrar clases</span><div class="seg">
          <button type="button" data-only="todas" class="${cal.only === 'todas' ? 'on' : ''}">${micon(MI.eye)}Todas</button>
          <button type="button" data-only="proximas" class="${cal.only === 'proximas' ? 'on' : ''}">${micon(MI.eyeOff)}Próximas</button></div></div>
        <div class="admin-period"><span class="cal-label">Periodo</span><div class="period">
          <button type="button" id="aPrev" aria-label="Anterior">${micon(MI.prev)}</button>
          <span>${cal.mode === 'dia' ? dayTitle(start) : periodLabel(start, end)}</span>
          <button type="button" id="aNext" aria-label="Siguiente">${micon(MI.next)}</button></div>
          <div class="cal-filter-row"><button type="button" class="btn-today" id="aToday">${micon(MI.cal)}Ir a Hoy</button>
            <button type="button" class="btn-filter ${cal.filter ? 'on' : ''}" id="aFilter">${micon(MI.filter)}Filtrar${cal.filter ? ' · ' + esc(clase(cal.filter).nombre) : ''}</button></div></div>
      </div>
      ${cal.open ? `<div class="chips"><button class="chip ${!cal.filter ? 'on' : ''}" data-f="">Todas</button>
        ${used.map(id => `<button class="chip ${cal.filter === id ? 'on' : ''}" data-f="${esc(id)}">${esc(clase(id).nombre)}</button>`).join('')}</div>` : ''}
      <div class="acards">${cards.join('') || `<div class="cal-empty"><img src="${LOGO_FLOWER}" alt="">No hay clases que mostrar</div>`}</div>
      <p class="admin-tz">Fechas y horas en la hora del centro de México <span>(America/Mexico_City)</span></p>`;
    $$('[data-mode]', box).forEach(b => b.addEventListener('click', () => { cal.mode = b.dataset.mode; refresh(); }));
    $$('[data-only]', box).forEach(b => b.addEventListener('click', () => { cal.only = b.dataset.only; draw(); }));
    $('#aPrev', box).addEventListener('click', () => { cal.day = addDays(cal.mode === 'semana' ? mondayOf(cal.day) : cal.day, cal.mode === 'semana' ? -7 : -1); refresh(); });
    $('#aNext', box).addEventListener('click', () => { cal.day = addDays(cal.mode === 'semana' ? mondayOf(cal.day) : cal.day, cal.mode === 'semana' ? 7 : 1); refresh(); });
    $('#aToday', box).addEventListener('click', () => { cal.day = today; refresh(); });
    $('#aFilter', box).addEventListener('click', () => { cal.open = !cal.open; draw(); });
    $$('[data-f]', box).forEach(b => b.addEventListener('click', () => { cal.filter = b.dataset.f; cal.open = false; draw(); }));
    $$('[data-att]', box).forEach(b => b.addEventListener('click', () => attendanceModal(b.dataset.att, b.dataset.date, refresh)));
    return [start, end];
  };
  const refresh = async () => {
    const [start, end] = draw();
    S.occ = {};
    await loadOccupancy(start, end);
    if (box.isConnected) draw();
  };
  await refresh();
}

      Inscritos: <b>${x.reservas.length}${s.cupo ? ' / ' + s.cupo : ''}</b> · Asistieron: <b>${n('asistio')}</b> · Faltaron: <b>${n('falta')}</b></p>
      ${x.reservas.length ? `<div class="table-wrap"><table><tbody>${x.reservas.map(r => `<tr><td>${esc(r.nombre)}<div class="muted small">${esc(r.telefono)}</div></td>
        <td>${stateTag(r.estado)}</td><td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
        <button class="btn btn-ghost btn-sm" data-mark="${r.estado === 'asistio' ? 'reservada' : 'asistio'}" data-id="${esc(r.id)}">${r.estado === 'asistio' ? 'Deshacer' : 'Asistió'}</button>
        <button class="btn btn-ghost btn-sm" data-mark="${r.estado === 'falta' ? 'reservada' : 'falta'}" data-id="${esc(r.id)}">${r.estado === 'falta' ? 'Deshacer' : 'Faltó'}</button>
        <button class="btn btn-danger btn-sm" data-acancel="${esc(r.id)}">Cancelar</button></div></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="cal-empty">Aún no hay inscritos en esta clase.</div>'}
      ${x.reservas.some(r => r.estado === 'reservada') ? '<p><button class="btn btn-primary btn-sm" id="allIn">Marcar a todos como asistió</button></p>' : ''}
      <form class="row" id="addFor" style="margin-top:12px"><select name="usuarioId" style="max-width:300px"><option value="">Agregar estudiante…</option>
        ${students.filter(u => u.activo).map(u => `<option value="${esc(u.id)}">${esc(u.nombre)} (${esc(u.clasesDisponibles)})</option>`).join('')}</select>
        <button class="btn btn-ghost btn-sm" type="submit">Agregar</button></form>`;
    const done = async () => { await load(); if (after) after(); };
    $$('[data-mark]', body).forEach(b => b.addEventListener('click', () => busy(b, async () => { await call('admin.markAttendance', { reservaId: b.dataset.id, estado: b.dataset.mark }); await done(); }).catch(() => {})));
    $$('[data-acancel]', body).forEach(b => b.addEventListener('click', () => {
      if (!confirm('¿Cancelar la reserva y devolver la clase al estudiante?')) return;
      busy(b, async () => { await call('admin.cancelFor', { reservaId: b.dataset.acancel }); S.adm.students = null; await done(); }).catch(() => {});
    }));
    if ($('#allIn', body)) $('#allIn', body).addEventListener('click', e => busy(e.target, async () => {
      for (const r of x.reservas.filter(r => r.estado === 'reservada')) await call('admin.markAttendance', { reservaId: r.id, estado: 'asistio' });
      await done();
    }).catch(() => {}));
    $('#addFor', body).addEventListener('submit', e => {
      e.preventDefault();
      const usuarioId = e.target.usuarioId.value;
      if (!usuarioId) return;
      busy($('button', e.target), async () => { await call('admin.bookFor', { usuarioId, horarioId, fecha }); S.adm.students = null; toast('Estudiante agregado.'); await done(); }).catch(() => {});
    });
  };
  await load().catch(e => { body.innerHTML = `<p class="muted">${esc(e.message)}</p>`; });
}

// ---------------------------------------------------------------------------
// Instalar como app (solo en GitHub Pages, que tiene manifiesto y service worker).
// En celular se invita una vez, a los pocos segundos; "Ahora no" la pospone 7 días y
// el botón "Instalar" sigue en la barra, junto al menú. Chrome no siempre avisa que se
// puede instalar (lo hace tras un rato de uso), así que la tarjeta no depende de ese
// aviso: si llega, ofrece el botón directo; si no, muestra los pasos del navegador.
// index.html guarda el aviso en window.__ycInstall por si llega antes que este script.

const INSTALL = { evt: window.__ycInstall || null, shown: false, laterKey: 'yc_install_later', laterDays: 7 };
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isPhone = () => matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !!API_URL && !isStandalone() && (!!INSTALL.evt || isPhone());

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); // se usa nuestra invitación en lugar de la barra del navegador
  INSTALL.evt = e;
  if (!S.data) return;
  renderNav();
  // Si la tarjeta ya está abierta con instrucciones, se cambia por el botón directo.
  if ($('#installSheet.open')) showInstall(); else maybeInviteInstall();
});
window.addEventListener('appinstalled', () => {
  INSTALL.evt = null;
  hideInstall();
  toast('¡Listo! yogacentral ya está en tu pantalla de inicio.');
  renderNav();
});

function initInstall() {
  maybeInviteInstall();
}

// Solo se invita en páginas para ver; nunca en iniciar sesión, crear cuenta ni paneles,
// donde la tarjeta taparía el botón del formulario en pantallas chicas.
const INVITE_PAGES = ['inicio', 'horarios', 'paquetes', 'instructores'];
const onInvitePage = () => INVITE_PAGES.indexOf(routeKey(currentRoute()[0]) || '') >= 0;
const typingNow = () => !!(document.activeElement && document.activeElement.matches && document.activeElement.matches('input, textarea, select'));

// ---------------------------------------------------------------------------
// Pagos por aprobar: número en el menú y aviso al abrir la app (solo administradores).

S.pending = [];
S.pendingSeen = 0;
const pendingBadge = () => (S.pending.length ? `<span class="badge" aria-label="${S.pending.length} por aprobar">${S.pending.length}</span>` : '');
function setPending(list) {
  // Solo cuentan los que ya tienen comprobante: los demás aún no pagan.
  S.pending = list.filter(c => c.estado === 'pendiente' && c.comprobante);
  if (S.pending.length < S.pendingSeen) S.pendingSeen = S.pending.length;
  renderNav();
  // En celular "Administrar" está dentro del menú: el punto rojo avisa en el botón.
  $('#menuBtn').classList.toggle('alert', S.pending.length > 0);
  $$('[data-badge="pagos"]').forEach(el => { el.innerHTML = pendingBadge(); });
}
async function checkPending() {
  if (!S.user || S.user.rol !== 'admin') return;
  setPending(await call('admin.purchases', { estado: 'pendiente' }).catch(() => S.pending));
  // Se avisa una vez por cada pago nuevo; no en la propia pantalla de pagos ni encima de otra ventana.
  if (S.pending.length <= S.pendingSeen || currentRoute().join('/') === 'admin/pagos' || !$('#modal').hidden || typingNow()) return;
  S.pendingSeen = S.pending.length;
  const n = S.pending.length;
  openModal(n === 1 ? 'Tienes un pago por aprobar' : `Tienes ${n} pagos por aprobar`,
    `<p class="muted">${n === 1 ? 'Esta persona subió su comprobante y espera' : 'Estas personas subieron su comprobante y esperan'} tu aprobación para usar su paquete.</p>
    <ul class="pending-list">${S.pending.slice(0, 4).map(c => `<li><span class="pending-dot"></span><div><b>${esc(c.usuario)}</b>
      <div class="muted small">${esc(c.paquete)} · ${money(c.precio)}</div></div></li>`).join('')}</ul>
    ${n > 4 ? `<p class="muted small">y ${n - 4} más…</p>` : ''}
    <div class="row" style="margin-top:18px"><button class="btn btn-primary" id="pendGo">Revisar ahora</button>
    <button class="btn btn-ghost" data-close>Más tarde</button></div>`);
  $('#pendGo').addEventListener('click', () => { closeModal(); go('admin/pagos'); });
}
// Al volver a la app (cambiar de pestaña o desbloquear el celular) se revisa si llegaron pagos.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkPending(); });

function maybeInviteInstall() {
  if (INSTALL.shown || !canInstall() || !isPhone() || !onInvitePage()) return;
  const later = Number(store.get(INSTALL.laterKey) || 0);
  if (Date.now() - later < INSTALL.laterDays * 864e5) return;
  INSTALL.shown = true;
  setTimeout(() => {
    // Si al llegar el momento la persona está en otra página o escribiendo, se intenta después.
    if (!$('#modal').hidden || typingNow() || !onInvitePage()) { INSTALL.shown = false; return; }
    showInstall();
  }, 3500);
}

// Al escribir en un formulario o cambiar a una página que no es para ver, la tarjeta se quita.
document.addEventListener('focusin', e => {
  if (e.target.matches && e.target.matches('input, textarea, select') && !e.target.closest('#installSheet')) hideInstall();
});

function installSteps() {
  const share = '<svg viewBox="0 0 24 24" class="i-inline" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
  const ua = navigator.userAgent;
  if (isIOS()) return `<ol class="install-steps"><li>Toca ${share} <b>Compartir</b> en la barra de Safari.</li><li>Elige <b>Agregar a inicio</b>.</li><li>Toca <b>Agregar</b>.</li></ol>`;
  if (/SamsungBrowser/i.test(ua)) return '<ol class="install-steps"><li>Toca el menú <b>≡</b> abajo a la derecha.</li><li>Elige <b>Agregar página a</b> → <b>Pantalla de inicio</b>.</li></ol>';
  if (/Firefox/i.test(ua)) return '<ol class="install-steps"><li>Toca el menú <b>⋮</b>.</li><li>Elige <b>Instalar</b>.</li></ol>';
  return '<ol class="install-steps"><li>Toca el menú <b>⋮</b> arriba a la derecha del navegador.</li><li>Elige <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</li></ol>';
}

function showInstall() {
  let sheet = $('#installSheet');
  if (!sheet) {
    sheet = document.createElement('aside');
    sheet.id = 'installSheet';
    sheet.className = 'install-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-labelledby', 'installTitle');
    document.body.appendChild(sheet);
  }
  const direct = !!INSTALL.evt;
  sheet.innerHTML = `<button class="install-x" data-install-close aria-label="Cerrar">×</button>
    <div class="install-head"><img src="app/icons/icon-192.png" alt="" width="56" height="56">
      <div><h3 id="installTitle">Lleva ${esc(cfg().nombre || 'YogaCentral')} en tu celular</h3>
      <p class="muted small">Gratis y sin ocupar espacio de tienda de apps.</p></div></div>
    <ul class="install-perks"><li><span>⚡</span>Abre al instante</li><li><span>📶</span>Funciona con poca señal</li><li><span>🧘</span>Reserva en dos toques</li></ul>
    ${direct ? '' : installSteps()}
    <div class="row install-actions">${direct ? '<button class="btn btn-primary" data-install-go>Instalar</button>' : ''}
      <button class="btn btn-ghost" data-install-later>${direct ? 'Ahora no' : 'Entendido'}</button></div>`;
  requestAnimationFrame(() => sheet.classList.add('open'));
  $('[data-install-close]', sheet).addEventListener('click', laterInstall);
  $('[data-install-later]', sheet).addEventListener('click', laterInstall);
  const go = $('[data-install-go]', sheet);
  if (go) go.addEventListener('click', async () => {
    const evt = INSTALL.evt;
    if (!evt) return;
    evt.prompt();
    const choice = await evt.userChoice.catch(() => ({ outcome: 'dismissed' }));
    INSTALL.evt = null;
    if (choice.outcome !== 'accepted') store.set(INSTALL.laterKey, String(Date.now()));
    hideInstall();
    renderNav();
  });
}

function laterInstall() {
  store.set(INSTALL.laterKey, String(Date.now()));
  hideInstall();
  toast('Puedes instalarla cuando quieras con el botón Instalar de arriba.');
}

function hideInstall() {
  const sheet = $('#installSheet');
  if (sheet) sheet.classList.remove('open');
}

// ---------------------------------------------------------------------------
// Arranque

document.addEventListener('click', e => {
  if (e.target.closest('[data-install-open]')) { e.preventDefault(); showInstall(); }
  if (e.target.closest('[data-close]')) closeModal();
  // Apps Script sirve la página dentro de un marco: llamar y escribir correo se abren fuera de él.
  const contact = e.target.closest('a[href^="tel:"], a[href^="mailto:"]');
  if (contact) contact.target = '_top';
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#menuBtn').addEventListener('click', () => {
  const open = $('#nav').classList.toggle('open');
  $('#menuBtn').setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', e => { if (editingSite()) e.preventDefault(); });

// Arranque inmediato con lo guardado de la visita anterior; los datos frescos llegan después
// y solo se vuelve a dibujar si cambiaron y la persona no está llenando un formulario.
function applyBootstrap(data) {
  S.data = data;
  S.user = data.user || null;
  if (!S.user && S.token) { store.set('yc_token', null); S.token = null; }
  store.set('yc_user', S.user ? JSON.stringify(S.user) : null);
}

function showBootError(e) {
  $('#app').innerHTML = '<div class="wrap section center"><h2>' + (e.offline ? 'Sin conexión' : 'No pudimos cargar el sitio') + '</h2><p class="muted">' +
    esc(e.offline ? 'Para la primera visita necesitas internet. Después el sitio abre aunque tengas poca señal.' : e.message) +
    '</p><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>';
}

async function refreshBootstrap() {
  const fresh = await call('public.bootstrap');
  const publicPart = Object.assign({}, fresh, { user: null, ahora: '' });
  const before = JSON.stringify(Object.assign({}, S.data || {}, { user: null, ahora: '' }));
  saved.set('yc_boot', publicPart);
  const changed = JSON.stringify(publicPart) !== before || JSON.stringify(fresh.user) !== JSON.stringify(S.user);
  applyBootstrap(fresh);
  return changed;
}

(async function start() {
  S.token = store.get('yc_token');
  initPlayer();
  const hit = saved.get('yc_boot');
  if (hit) {
    let user = null;
    try { user = JSON.parse(store.get('yc_user') || 'null'); } catch (e) { user = null; }
    applyBootstrap(Object.assign({}, hit.v, { user: S.token ? user : null }));
    renderChrome(); renderNav(); render();
  }
  try {
    const changed = await refreshBootstrap();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('form');
    if (!hit || (changed && $('#modal').hidden && !typing && !editingSite())) { renderChrome(); renderNav(); render(); }
    else { renderChrome(); renderNav(); }
    setTimeout(checkPending, 600);
  } catch (e) {
    if (!hit) return showBootError(e);
    if (e.offline) setOffline(true, hit.t);
  }
  initInstall();
})();

window.addEventListener('online', () => { setOffline(false); refreshBootstrap().then(changed => { if (changed && $('#modal').hidden && !editingSite()) { renderChrome(); renderNav(); render(); } }).catch(() => null); });
window.addEventListener('offline', () => setOffline(true));
</script>
